name: Extract and publish bulletin data
on:
  push:
    branches: [main]
    paths:
      - current-bulletin.pdf
      - scripts/extract_bulletin.py
      - .github/workflows/update-bulletin.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.26.5
      - name: Extract and validate bulletin
        run: python scripts/extract_bulletin.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulletin-data.json bulletin-data.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update website data from current bulletin PDF"
            git push
          fi


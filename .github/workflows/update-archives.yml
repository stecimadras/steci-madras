name: Update archived newsletter list
on:
  push:
    branches: [main]
    paths:
      - 'archives/**'
      - 'scripts/update_archives.py'
      - '.github/workflows/update-archives.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate archive index
        run: python scripts/update_archives.py
      - name: Commit archive index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archives-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh archived newsletter links"
            git push
          fi

